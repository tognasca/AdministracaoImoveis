services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: imoveis
      POSTGRES_USER: imoveis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD no .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U imoveis -d imoveis"]
      interval: 5s
      timeout: 4s
      retries: 12
  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      ConnectionStrings__Imoveis: 'Host=db;Database=imoveis;Username=imoveis;Password=${POSTGRES_PASSWORD}'
      Admin__Password: ${ADMIN_PASSWORD:?Configure ADMIN_PASSWORD no .env}
      Vitrine__WhatsApp: ${VITRINE_WHATSAPP:-}
      Media__Path: /media/imoveis
    ports:
      - '127.0.0.1:${IMOVEIS_PORT:-5086}:8080'
    volumes:
      - type: bind
        source: ${MEDIA_DIRECTORY:-./midia}
        target: /media/imoveis
      - keys:/keys
volumes:
  database:
  keys:
