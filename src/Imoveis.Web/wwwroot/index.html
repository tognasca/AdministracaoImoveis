<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Imóveis Cotia</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f7f8f3;color:#173128;font:16px system-ui,sans-serif}a{color:inherit}header,footer{padding:18px max(5vw,18px);display:flex;gap:20px;align-items:center;justify-content:space-between;background:#082e20;color:white}header a{text-decoration:none} .brand{font: bold 26px Georgia}main{padding:32px max(5vw,18px);min-height:75vh}h1,h2,h3,p{margin-top:0}h1{font: bold clamp(32px,5vw,60px) Georgia;letter-spacing:-.035em}h2{font: bold 30px Georgia}button,.btn{display:inline-block;cursor:pointer;background:#12482f;color:white;border:1px solid #12482f;border-radius:8px;padding:10px 15px;font:inherit;text-decoration:none}button.alt,.alt{background:white;color:#12482f}button:disabled{opacity:.5;cursor:default}input,select,textarea{font:inherit;padding:10px;border:1px solid #bdc9be;border-radius:7px;width:100%;background:white;color:#173128}label{display:grid;gap:5px}.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(240px,100%),1fr))}.row{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:14px 0}.row>*{width:auto}.box,article{background:white;border:1px solid #dbe4d9;border-radius:14px;padding:20px;margin-bottom:16px}.hero{min-height:360px;border-radius:18px;padding:36px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;color:white;background:linear-gradient(90deg,#09271fee,transparent),#17412f}.hero p{max-width:330px}.hero h1{max-width:560px;margin-bottom:12px}.photo{width:100%;object-fit:cover;border-radius:9px;aspect-ratio:2/1}.thumb{aspect-ratio:3/2}.price{font-size:25px;font-weight:800}.muted,small{color:#54675c}.chips{padding:6px 10px;background:#e6f1e6;border-radius:20px}.table{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left}th,td{padding:12px;border-bottom:1px solid #e0e7df}th{background:#f0f4ed}td input,td select{min-width:148px}.notice{padding:12px;background:#e6f1e6;border-radius:8px;margin-bottom:16px}nav{display:flex;gap:14px;flex-wrap:wrap}fieldset{border:0;padding:0;margin:0}details{margin:12px 0}summary{cursor:pointer}.spaced{justify-content:space-between}#feedback:empty{display:none}@media(max-width:600px){header{align-items:flex-start;flex-direction:column}.hero{padding:22px}main{padding-top:22px}}
</style>
<header><a class="brand" href="/#vitrine">⌂ Imóveis Cotia</a><nav><a href="/#vitrine">Vitrine</a><a href="/#admin">Painel administrativo</a></nav></header>

<footer><span>Imóveis Cotia</span></footer><script type="module" src="/app.js"></script></body></html>
